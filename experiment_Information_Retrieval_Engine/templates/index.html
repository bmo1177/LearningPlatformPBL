<!DOCTYPE html>
<html>
<head>
    <title>IR Search Engine</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🔍 Information Retrieval Engine</h1>
        <div class="search-box">
            <input type="text" id="query" placeholder="Search...">
            <select id="model">
                <option value="bm25">BM25</option>
                <option value="tfidf">TF-IDF</option>
                <option value="boolean">Boolean</option>
            </select>
            <button onclick="doSearch()">Search</button>
        </div>
        <div id="stats"></div>
        <div id="results"></div>
    </div>

    <script>
    async function doSearch() {
        const query = document.getElementById('query').value;
        const model = document.getElementById('model').value;
        const res = await fetch('/api/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query, model, top_k: 10})
        });
        const data = await res.json();
        const div = document.getElementById('results');
        const stats = document.getElementById('stats');

        stats.innerHTML = `<p>Found ${data.total_results} results in ${data.search_time_ms}ms using ${data.model.toUpperCase()}</p>`;

        if (data.results.length === 0) {
            div.innerHTML = '<p>No results found.</p>';
            return;
        }

        div.innerHTML = data.results.map((r, i) =>
            `<div class="result">
                <strong>#${i+1}</strong> (score: ${r.score.toFixed(4)})
                <pre>${JSON.stringify(r.document, null, 2)}</pre>
            </div>`
        ).join('');
    }

    async function loadStats() {
        const res = await fetch('/api/statistics');
        const data = await res.json();
        console.log('Statistics:', data);
    }
    loadStats();
    </script>
</body>
</html>
